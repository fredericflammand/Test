name: BuildPublishTestImage

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: portainertest-whoami

jobs:
  build-publish:
    name: Build and publish test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          VERSION_TAG="$(date -u +'%Y.%-m.%-d').${GITHUB_RUN_NUMBER}"

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_REF}:latest" >> "$GITHUB_OUTPUT"
          echo "version_tag=${IMAGE_REF}:${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.latest_tag }}
            ${{ steps.meta.outputs.version_tag }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## GHCR image published"
            echo "- Image: ${{ steps.meta.outputs.image_ref }}"
            echo "- Tags:"
            echo "  - latest"
            echo "  - ${{ steps.meta.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
