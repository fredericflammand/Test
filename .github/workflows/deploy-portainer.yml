name: DeployPortainerStack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service_tag:
        description: Tag image a deployer
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  deploy-portainer:
    name: Update Portainer stack
    runs-on:
      - self-hosted
      - linux
      - docker
      - deployment
    env:
      APP_IMAGE: ${{ vars.APP_IMAGE }}
      PORTAINER_URL: ${{ vars.PORTAINER_URL }}
      PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
      PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.service_tag || 'latest' }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          for value in PORTAINER_URL PORTAINER_ENDPOINT_ID PORTAINER_STACK_ID PORTAINER_API_KEY APP_IMAGE DEPLOY_TAG; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required configuration: $value"
              exit 1
            fi
          done

      - name: Verify image exists
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${APP_IMAGE}:${DEPLOY_TAG}"

          if docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "Image found: $IMAGE_REF"
          else
            echo "Image not found: $IMAGE_REF"
            exit 1
          fi

      - name: Fetch current stack file
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID/file" \
            > stack-file-response.json

      - name: Build Portainer payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          response = json.loads(Path("stack-file-response.json").read_text(encoding="utf-8"))
          stack_file = response["StackFileContent"]

          payload = {
              "Env": [
                  {"name": "APP_IMAGE", "value": os.environ["APP_IMAGE"]},
                  {"name": "SERVICE_TAG", "value": os.environ["DEPLOY_TAG"]},
              ],
              "Prune": False,
              "PullImage": False,
              "RepullImageAndRedeploy": True,
              "StackFileContent": stack_file,
          }

          Path("portainer-update-payload.json").write_text(
              json.dumps(payload),
              encoding="utf-8",
          )
          PY

      - name: Update stack via Portainer API
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            -X PUT \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "Content-Type: application/json" \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID?endpointId=$PORTAINER_ENDPOINT_ID" \
            --data-binary @portainer-update-payload.json

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Portainer deployment"
            echo "- Stack id: $PORTAINER_STACK_ID"
            echo "- Endpoint id: $PORTAINER_ENDPOINT_ID"
            echo "- Image: $APP_IMAGE"
            echo "- Tag deployed: $DEPLOY_TAG"
            echo "- Triggered from: ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
